site_name: 'McCreary Family Heritage'
site_description: 'McCreary family heritage website and educational resources for teaching Scottish, Irish and immigration history and genealogy.'
site_author: 'Dan McCreary'
repo_name: 'GitHub Repo'
site_url: 'https://dmccreary.github.io/mccreary-heritage/'
repo_url: 'https://github.com/dmccreary/mccreary-heritage'
edit_uri: 'blob/master/docs'

nav:
  - Home: index.md
  - About: about.md
  - Chapters:
    - Table of Contents: content/index.md
    - Introduction: content/01-introduction/index.md
    - Family History and Genealogy: content/02-family-history-and-genealogy/index.md
    - Timeline: content/03-timeline/index.md
    - Geography: content/04-geography/index.md
    - Education: content/05-education/index.md
    - Religion: content/06-religion/index.md
    - Culture and Traditions: content/07-culture-and-traditions/index.md
    - Research: content/08-research/index.md
    - Stories: content/09-stories/index.md
  - Applications & Tools:
    - List of Applications & Tools: sims/index.md
    - Migration Simulation: sims/migration/index.md
    - Timeline Viewer: sims/timeline/index.md
    - Maps: sims/maps/index.md
    - Map Generation: sims/maps/map-documentation.md
  - Glossary: glossary.md
  - How We Built This Site: how-we-built-this-site.md
  - Prompts:
    - Migration v2: prompts/migration-1.md
    - Migration: prompts/migration.md
    - Ulster Plantation Maps: prompts/ulster-plantation-map.md
  
  - References: references.md
  - Contact: contact.md
  - License: license.md
  - Prompts:
    - prompts/index.md
    - prompts/introduction.md
    - prompts/timeline-chapter-text.md
    - prompts/personas.md
    - prompts/readme.md
    - prompts/site-layout.md

# CoderDojo Microsite Standards from here down

theme:
  name: material
  extra_css:
    - styles/custom.css
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    primary: 'blue'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    # this adds the prev and next icons in the footer
    - navigation.footer
    - content.action.edit
plugins:
  - search
#  - social
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.highlight:
      linenums: true
extra_css:
   - css/extra.css
extra_javascript:
   - js/extra.js
